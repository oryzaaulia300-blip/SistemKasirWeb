<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Web</title>
    <!-- Menghubungkan file HTML ke style.css yang ada di folder static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Area Kiri: Daftar Produk -->
    <div class="kiri">
        <h2>Daftar Menu</h2>
        <div class="grid-produk">
            <!-- Looping data secara otomatis dari database PostgreSQL -->
            {% for item in menu_barang %}
            <button class="produk" onclick="tambahBarang('{{ item[0] }}', {{ item[1] }})">
                {{ item[0] }}<br>Rp {{ item[1] }}
            </button>
            {% endfor %}
        </div>
    </div>

    <!-- Area Kanan: Keranjang / Struk -->
    <div class="kanan">
        <h2>Struk Pesanan</h2>
        <table>
            <thead>
                <tr>
                    <th>Barang</th>
                    <th>Harga</th>
                </tr>
            </thead>
            <tbody id="daftar-keranjang">
                <!-- Barang yang ditekan dari menu sebelah kiri akan masuk ke sini -->
            </tbody>
        </table>
        
        <h3>Total: Rp <span id="total-harga">0</span></h3>
        
        <div class="input-area">
            <label>Uang Tunai: Rp </label>
            <input type="number" id="uang-tunai" oninput="hitungKembalian()" placeholder="Ketik nominal tunai...">
        </div>
        
        <h4>Kembalian: Rp <span id="teks-kembalian">0</span></h4>

        <button class="btn-cetak" onclick="window.print()">Simpan / Cetak PDF</button>
    </div>

    <!-- Logika JavaScript untuk Sistem Kasir -->
    <script>
        let total = 0;

        function tambahBarang(nama, harga) {
            const tbody = document.getElementById('daftar-keranjang');
            
            // Menambah baris baru di tabel struk HTML
            tbody.innerHTML += `<tr><td>${nama}</td><td>${harga.toLocaleString('id-ID')}</td></tr>`;
            
            // Mengkalkulasi total secara otomatis
            total += harga;
            document.getElementById('total-harga').innerText = total.toLocaleString('id-ID');
            
            // Mengecek kembalian otomatis jika kolom uang tunai sudah terisi
            hitungKembalian();
        }

        function hitungKembalian() {
            const tunai = document.getElementById('uang-tunai').value;
            const kembalian = tunai - total;
            const teksKembalian = document.getElementById('teks-kembalian');
            
            if (tunai === "") {
                teksKembalian.innerText = "0";
                teksKembalian.style.color = "black";
            } else if (kembalian >= 0) {
                teksKembalian.innerText = kembalian.toLocaleString('id-ID');
                teksKembalian.style.color = "black";
            } else {
                teksKembalian.innerText = "Uang Tidak Cukup!";
                teksKembalian.style.color = "red";
            }
        }
    </script>
</body>
</html>
